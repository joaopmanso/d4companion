name: Sync guides

# Daily: re-read the d4builds tier list and every class's guides, and commit any changes to public/data.
# The deploy workflow runs after this one finishes, so the site picks the changes up.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-guides
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run sync
      - run: npm test
      - name: Commit changes
        run: |
          git add public/data
          if git diff --cached --quiet; then
            echo "No guide changes today."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync guides $(date -u +%Y-%m-%d)"
          # main may have moved during a long sync; replay this data commit on top of it.
          git pull --rebase -X theirs origin main
          git push
