<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>D4 Companion</title>
  <meta name="description" content="Diablo IV build companion: characters, loadouts, screenshot item checks, skills, Paragon and farming routes.">
  <link rel="icon" href="art/class-warlock.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cinzel+Decorative:wght@700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
</head>
<body>
  <header class="wrap masthead">
    <span class="label" id="season-line">Diablo IV · Season 15</span>
    <h1>D4 Companion</h1>
    <div class="flourish" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 2c1.5 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2.2 1-3.6 2.2-4.8.2 1.6.9 2.6 1.9 3.1C10.6 7.6 11 4.6 12 2Z" fill="currentColor"/></svg>
    </div>
    <div class="topbar">
      <label class="sr" for="char-pick">Character</label>
      <select id="char-pick"></select>
      <button class="btn ghost" id="char-manage" type="button">Characters &amp; settings</button>
    </div>
    <p class="build-line" id="build-line"></p>
    <p class="note paste-hint">Paste a tooltip screenshot anywhere with <kbd>Ctrl</kbd>+<kbd>V</kbd>, or drop the image on the page.</p>
  </header>

  <nav class="tabs" aria-label="Sections">
    <div class="wrap" role="tablist" id="tabs"></div>
  </nav>

  <main class="wrap" id="main"></main>

  <div class="drop-veil" id="drop-veil">Drop the tooltip screenshot to check it</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
